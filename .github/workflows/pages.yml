name: Build and deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.list"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build limit lists
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0

      - name: Restore center images
        uses: actions/cache@v5
        with:
          path: vendor/typst-ygo/assets/ot/images
          key: ${{ runner.os }}-center-images-${{ hashFiles('**/*.list') }}
          restore-keys: |
            ${{ runner.os }}-center-images-

      - name: Test
        run: cargo test --release --all-targets --locked

      - name: Build PDFs and site
        run: cargo run --release --locked -- build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
